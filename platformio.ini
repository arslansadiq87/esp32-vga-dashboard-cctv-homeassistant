[env:esp32-s3-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n
    CONFIG_COMPILER_OPTIMIZATION_SIZE=y
    CONFIG_FREERTOS_HZ=1000
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
extra_scripts = pre:scripts/embed_managed_certs.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@6.21.5
    bitbank2/JPEGDEC@1.8.4
